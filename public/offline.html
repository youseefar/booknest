<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#17355c">
    <title>Offline - Jacob Estate</title>
    <link rel="icon" type="image/svg+xml" href="/jacobrent-app-icon.svg">
    <style>
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 1.5rem; background: #f2f5ef; color: #17355c; font-family: 'Segoe UI', sans-serif; text-align: center; }
        main { width: min(100%, 24rem); }
        img { width: 84px; height: 84px; margin: 0 auto 1rem; }
        h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
        p { margin: 0 0 1.25rem; color: #526579; }
        a { display: inline-block; padding: 0.65rem 1rem; border-radius: 6px; background: #17355c; color: #fff; font-weight: 700; text-decoration: none; }
    </style>
</head>
<body>
    <main>
        <img src="/jacobrent-app-icon.svg" alt="">
        <h1>You’re offline</h1>
        <p>Reconnect to browse homes and manage your account.</p>
        <a href="/">Try again</a>
    </main>
</body>
</html>
